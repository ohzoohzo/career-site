<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용 공고 · 커리어 길잡이</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="#c8283c" stroke-width="2.5"/><path d="M20 8l5 12-5 12-5-12z" fill="none" stroke="#14284b" stroke-width="2"/><path d="M20 8l5 12h-10z" fill="#c8283c"/></svg>
      <span><b>커리어 길잡이</b><small>좋은 시작이, 좋은 커리어를 만듭니다.</small></span>
    </a>
    <nav class="tabs" aria-label="주 메뉴">
      <a href="../index.html">홈</a>
      <a href="../roles/index.html">직무 사전</a>
      <a href="index.html" aria-current="page">채용 공고</a>
      <a href="../faq/index.html">자주 묻는 질문</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>
      <svg viewBox="0 0 30 34" aria-hidden="true"><path d="M4 2v30" stroke="#8d1424" stroke-width="3" stroke-linecap="round"/><path d="M5 3h22l-5 7 5 7H5z" fill="#c8283c"/></svg>
      채용 공고
    </h1>
    <p>나에게 맞는 기회를 찾고, 다음 걸음을 준비해요.</p>
  </section>

  <div class="filters" role="group" aria-label="공고 필터">
    <span class="label" id="roleLabel">직군:</span>
    <span id="roleChips" role="group" aria-labelledby="roleLabel" style="display:contents"></span>
    <span class="sep" aria-hidden="true"></span>
    <button class="chip" id="fNew" aria-pressed="false">신입만</button>
    <button class="chip" id="fAi" aria-pressed="false">AI 우대</button>
  </div>

  <div class="layout">
    <section class="board" aria-labelledby="boardTitle">
      <div class="board-head">
        <h2 id="boardTitle">기회의 게시판</h2>
        <span id="count" aria-live="polite"></span>
      </div>
      <ul class="grid" id="grid"></ul>
    </section>

    <aside class="cal" aria-labelledby="calTitle">
      <div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h2 id="calTitle">이번 달 마감</h2>
      <div class="month">
        <button id="prev" aria-label="이전 달">‹</button>
        <b id="monthLabel"></b>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <table class="days">
        <thead><tr><th scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th><th scope="col">토</th></tr></thead>
        <tbody id="days"></tbody>
      </table>
      <div class="upcoming">
        <h3>다가오는 마감</h3>
        <ul id="upcoming"></ul>
      </div>
    </aside>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span><b>커리어 길잡이</b> · 좋은 시작이, 좋은 커리어를 만듭니다.</span>
    <span>지금도, 더 나은 내일을 준비하는 모든 사람의 곁에.</span>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
